version: 2
updates:
  - package-ecosystem: docker-compose
    directories:
      - /
      - /hardware-testing/github-runner/docker-compose
    schedule:
      interval: weekly

  # Go and OpenTofu in the HIL runner image. Redeploy the runner after merging.
  - package-ecosystem: docker
    directory: /hardware-testing/github-runner/docker-compose
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
