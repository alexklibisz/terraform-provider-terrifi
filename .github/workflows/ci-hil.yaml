# Hardware-in-the-loop tests. They run on a self-hosted runner with the labels
# `self-hosted` + `terrifi-hardware-test`, wired to a real UniFi controller —
# infrastructure that only exists in the upstream repo. The repository guard
# on every job keeps this inert in forks. The test steps live in
# ci-hil-run.yaml.
#
# Who runs what:
# - Cron, manual dispatch, and PRs from branches in this repo run directly.
#   Pushing a branch here already requires write access.
# - PRs from forks run through `pull_request_target`, so this file and
#   ci-hil-run.yaml always come from main, never from the PR. The run pauses
#   on the `hil-fork-approval` environment until a maintainer approves it.
#   Read the PR diff at the commit shown in the run before approving: the
#   approved run executes that exact commit, with the UniFi API key, on the
#   home lab runner. Every new push needs a new approval.
#
# Never add a step to this workflow that checks out or runs PR code outside
# ci-hil-run.yaml, and never run fork code before the approval gate.
#
# To opt a fork into HIL:
# 1. replace the repository name in each job's `if:` with your own `owner/repo`
# 2. register a self-hosted runner with the `self-hosted` + `terrifi-hardware-test` labels, pointed at your controller
# 3. add the `TERRIFI_HIL_TEST_UNIFI_API_KEY` secret in https://github.com/<owner/repo>/settings/secrets/actions
# 4. create a `hil-fork-approval` environment with yourself as a required reviewer

name: CI - HIL

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: Go test name regex (defaults to all acceptance tests)
        type: string
        default: '^TestAcc'
      test_count:
        description: Number of times to run each selected test
        type: number
        default: 1
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]
  schedule:
    - cron: '33 3 * * *'

# A new push to a fork PR supersedes its older run, including one still
# waiting for approval. Other events never cancel each other; the hardware
# job serializes itself in ci-hil-run.yaml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

# pull_request_target grants a write token by default. Nothing here needs it.
permissions:
  contents: read

jobs:
  trusted:
    name: Main
    # Cron, dispatch, and same-repo PRs. Fork PRs also fire `pull_request`,
    # but they get no secrets there, so skip them; `fork` handles them.
    if: >-
      github.repository == 'alexklibisz/terraform-provider-terrifi' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    uses: ./.github/workflows/ci-hil-run.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      test_filter: ${{ inputs.test_filter || '^TestAcc' }}
      test_count: ${{ inputs.test_count || 1 }}
      send_heartbeat: ${{ github.event_name == 'schedule' }}
    secrets:
      unifi_api_key: ${{ secrets.TERRIFI_HIL_TEST_UNIFI_API_KEY }}
      heartbeat_url: ${{ secrets.TERRIFI_HIL_HEARTBEAT_URL }}

  fork-approval:
    name: Fork PR approval
    if: >-
      github.repository == 'alexklibisz/terraform-provider-terrifi' &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository
    # Required reviewers on this environment are the gate. This job runs on a
    # GitHub-hosted runner so a run waiting for approval never occupies the
    # hardware runner or its concurrency group.
    environment: hil-fork-approval
    runs-on: ubuntu-latest
    steps:
      - name: Record approved commit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        # Block scalar: in a plain YAML scalar, " #" starts a comment and
        # truncates the command.
        run: |
          echo "Approved HIL run for PR #$PR_NUMBER at $HEAD_REPO@$HEAD_SHA"

  fork:
    name: Fork PR
    needs: fork-approval
    uses: ./.github/workflows/ci-hil-run.yaml
    with:
      # The exact commit the event was created for. A later push creates a
      # new run that needs its own approval.
      ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      unifi_api_key: ${{ secrets.TERRIFI_HIL_TEST_UNIFI_API_KEY }}
