name: CI - Local

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly run on main. The acceptance job pulls a published UniFi controller
  # image, so it can start failing without anything in this repo changing --
  # a new image tag, a controller behaviour change, an upstream base-image
  # update. Without a schedule that goes unnoticed until the next PR, which is
  # a bad time to discover it.
  schedule:
    - cron: "0 6 * * *"

jobs:
  main:
    name: Main
    runs-on: ubuntu-latest
    # Scheduled runs fire on forks too, where they only burn Actions minutes.
    if: github.event_name != 'schedule' || github.repository == 'alexklibisz/terraform-provider-terrifi'
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@v4
      - name: Set up Go
        timeout-minutes: 1
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set up OpenTofu
        timeout-minutes: 1
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - name: Configure OpenTofu for acceptance tests
        run: |
          echo "TF_ACC_TERRAFORM_PATH=$(which tofu)" >> "$GITHUB_ENV"
          echo "TF_ACC_PROVIDER_HOST=registry.opentofu.org" >> "$GITHUB_ENV"
      - name: Install Task
        timeout-minutes: 1
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Go dependencies
        timeout-minutes: 10
        run: task deps
      - name: Lint
        timeout-minutes: 5
        run: task lint
      - name: Build
        timeout-minutes: 10
        run: task build
      - name: Unit tests
        timeout-minutes: 1
        run: task test:unit
      - name: Compute Docker image cache key
        id: docker-image-key
        run: echo "hash=$(grep 'image:' docker-compose.yaml | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache Docker images
        uses: actions/cache@v4
        id: docker-cache
        with:
          path: /tmp/docker-images
          key: docker-images-${{ steps.docker-image-key.outputs.hash }}
      - name: Load cached Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        timeout-minutes: 1
        run: |
          for img in /tmp/docker-images/*.tar; do
            docker load -i "$img"
          done
      - name: Pull Docker images
        if: steps.docker-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          docker compose -f docker-compose.yaml pull --quiet
          mkdir -p /tmp/docker-images
          docker compose -f docker-compose.yaml config --images | while read -r img; do
            name=$(echo "$img" | tr '/.:' '___')
            docker save "$img" -o "/tmp/docker-images/${name}.tar"
          done
      - name: Acceptance tests (Docker)
        timeout-minutes: 10
        run: task test:acc
      - name: GoReleaser dry run
        timeout-minutes: 5
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: build --snapshot --clean
