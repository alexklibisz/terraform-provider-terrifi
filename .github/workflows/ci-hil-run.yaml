# Reusable HIL test run, called only by ci-hil.yaml. It runs on the
# self-hosted runner wired to the real UniFi controller:
#
#   cleanup-before -> tests -> cleanup-after
#
# Both cleanups reset the controller to the Terraform baseline at the same
# baseline commit, sharing their steps through a YAML anchor. cleanup-after
# runs whether the tests pass or fail, as long as cleanup-before succeeded.
#
# The caller must hold the `terrifi-hil-hardware` concurrency group around
# this whole workflow, so another run cannot reach the controller between
# these jobs.
#
# Security notes:
# - `ref` is always a commit SHA. For untrusted PRs (forks and Dependabot) it
#   is the SHA a maintainer reviewed and approved, so later pushes cannot
#   slip in unreviewed code.
# - State credentials go only to the reset step in the cleanup jobs, which
#   never run untrusted PR code.
# - Callers pass secrets explicitly. Untrusted PR code never receives the
#   heartbeat URL.
# - The caller restricts GITHUB_TOKEN to `contents: read`.
#
# See hardware-testing/SECURITY.md for the full security model.

name: CI - HIL (run)

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to check out and test
        type: string
        required: true
      test_filter:
        type: string
        default: '^TestAcc'
      test_count:
        type: number
        default: 1
      send_heartbeat:
        type: boolean
        default: false
      untrusted_pr:
        description: True only for approved fork or Dependabot PR runs from pull_request_target
        type: boolean
        default: false
    secrets:
      unifi_api_key:
        required: true
      heartbeat_url:
        required: false
      state_bucket:
        required: true
      state_endpoint:
        required: true
      state_access_key_id:
        required: true
      state_secret_access_key:
        required: true

permissions:
  contents: read

jobs:
  heartbeat:
    name: Cron heartbeat
    if: inputs.send_heartbeat
    runs-on: ubuntu-latest
    steps:
      - name: Send cron heartbeat
        timeout-minutes: 1
        env:
          HEARTBEAT_URL: ${{ secrets.heartbeat_url }}
        run: |
          # Confirm the cron started, independently of the test results.
          # Never log the URL or response, including curl's error messages.
          set +x
          if [ -z "$HEARTBEAT_URL" ]; then
            echo "Heartbeat URL secret is not configured."
            exit 1
          fi
          if ! curl --disable --fail --silent --output /dev/null \
            --connect-timeout 10 --max-time 30 "$HEARTBEAT_URL" >/dev/null 2>&1; then
            echo "Heartbeat request failed."
            exit 1
          fi

  cleanup-before:
    name: Cleanup before
    runs-on:
      - self-hosted
      - terrifi-hardware-test
    outputs:
      baseline_sha: ${{ steps.baseline.outputs.sha }}
    env:
      # Same-repo PRs can test baseline changes; approved untrusted PRs
      # always reset using main. Untrusted code never runs with state
      # credentials.
      BASELINE_REF: ${{ inputs.untrusted_pr && 'main' || inputs.ref }}
      # unifi.local is the name on the controller's self-signed certificate.
      # Runner containers resolve it to the controller's LAN address and trust
      # the certificate (see hardware-testing/github-runner/rsync.sh), so TLS is
      # verified and API traffic stays on the HIL LAN.
      UNIFI_API: https://unifi.local:11443
      UNIFI_API_KEY: ${{ secrets.unifi_api_key }}
    # Reused by cleanup-after through the YAML alias.
    steps: &reset-steps
      - name: Checkout baseline
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: alexklibisz/terraform-provider-terrifi
          ref: ${{ env.BASELINE_REF }}
          path: hil-baseline
          persist-credentials: false
      - name: Record baseline commit
        id: baseline
        working-directory: hil-baseline
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build Terrifi CLI
        timeout-minutes: 5
        working-directory: hil-baseline
        run: go build -o "$RUNNER_TEMP/terrifi-baseline-cli" ./cmd/terrifi
      - name: List controller resources
        # Log what is on the controller before resetting it, for debugging
        # leftovers. Passphrases are never printed: the API does not return
        # them.
        timeout-minutes: 2
        run: '"$RUNNER_TEMP/terrifi-baseline-cli" generate-imports all'
      - name: Reset HIL baseline
        timeout-minutes: 10
        working-directory: hil-baseline
        env:
          TERRIFI_STATE_BUCKET: ${{ secrets.state_bucket }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.state_endpoint }}
          AWS_ACCESS_KEY_ID: ${{ secrets.state_access_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.state_secret_access_key }}
        run: go run ./cmd/terrifi-tests reset --terrifi "$RUNNER_TEMP/terrifi-baseline-cli"
      - name: Remove baseline workspace
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/hil-baseline" "$RUNNER_TEMP/terrifi-baseline-cli"

  tests:
    name: HIL tests
    needs: cleanup-before
    runs-on:
      - self-hosted
      - terrifi-hardware-test
    env:
      # unifi.local is the name on the controller's self-signed certificate.
      # Runner containers resolve it to the controller's LAN address and trust
      # the certificate (see hardware-testing/github-runner/rsync.sh), so TLS is
      # verified and API traffic stays on the HIL LAN.
      UNIFI_API: https://unifi.local:11443
      UNIFI_API_KEY: ${{ secrets.unifi_api_key }}
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          # actions/checkout refuses fork code under pull_request_target by
          # default. Opt in only for untrusted PR runs, which reach this job
          # only after a maintainer approves the hil-fork-approval
          # environment. Dependabot branches are not forks, so the opt-in has
          # no effect for them. The token is read-only and credentials are not
          # persisted.
          allow-unsafe-pr-checkout: ${{ inputs.untrusted_pr }}
      - name: Show tool versions
        # Go, Task, and OpenTofu come from the runner image. If go.mod needs a
        # newer Go than the image has, Go downloads that toolchain itself
        # (GOTOOLCHAIN=auto) until the image is rebuilt.
        run: |
          go version
          task --version
      - name: Configure OpenTofu for acceptance tests
        # OpenTofu is installed in the runner image. Fail here if it is
        # missing; an empty path would make the tests download Terraform.
        run: |
          tofu="$(command -v tofu)"
          "$tofu" version
          echo "TF_ACC_TERRAFORM_PATH=$tofu" >> "$GITHUB_ENV"
          echo "TF_ACC_PROVIDER_HOST=registry.opentofu.org" >> "$GITHUB_ENV"
      - name: Check UniFi Connection
        timeout-minutes: 1
        run: task checkAPIConnection
      - name: Download Go dependencies
        timeout-minutes: 10
        run: task deps
      - name: Build
        timeout-minutes: 10
        run: task build
      - name: Acceptance tests (HIL)
        timeout-minutes: 10
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
          TEST_COUNT: ${{ inputs.test_count }}
        run: task test:acc:hardware -- -run "$TEST_FILTER" -count "$TEST_COUNT"

  cleanup-after:
    name: Cleanup after
    needs: [cleanup-before, tests]
    # Run after test failures and cancellations too, but never against a
    # controller the first cleanup could not reset.
    if: always() && needs.cleanup-before.result == 'success'
    runs-on:
      - self-hosted
      - terrifi-hardware-test
    env:
      # Pin to the commit cleanup-before used, so a push to main mid-run
      # cannot change the baseline.
      BASELINE_REF: ${{ needs.cleanup-before.outputs.baseline_sha }}
      # unifi.local is the name on the controller's self-signed certificate.
      # Runner containers resolve it to the controller's LAN address and trust
      # the certificate (see hardware-testing/github-runner/rsync.sh), so TLS is
      # verified and API traffic stays on the HIL LAN.
      UNIFI_API: https://unifi.local:11443
      UNIFI_API_KEY: ${{ secrets.unifi_api_key }}
    steps: *reset-steps
