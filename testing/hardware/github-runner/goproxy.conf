# Caching reverse proxy for proxy.golang.org, used by the runner containers
# through GOPROXY. See the `goproxy` service in docker-compose.yaml.

proxy_cache_path /var/cache/goproxy levels=1:2 keys_zone=goproxy:10m
                 max_size=2g inactive=30d use_temp_path=off;

server {
  listen 3000;

  proxy_ssl_server_name on;
  # Docker's embedded DNS, for the redirect targets below.
  resolver 127.0.0.11;
  # Fail a stalled download quickly, so Go falls back to proxy.golang.org.
  proxy_connect_timeout 10s;
  proxy_read_timeout 60s;
  # Key on the module path, not the upstream URL. A zip fetched through a
  # redirect (below) is then found by the next request for the same path,
  # without asking proxy.golang.org for a new signed URL.
  proxy_cache_key $request_uri;

  # A module version's .info, .mod, and .zip never change, so cache them for
  # as long as they are used, regardless of the upstream's short max-age.
  # Only for canonical versions (v1.2.3, pre-releases, pseudo-versions):
  # .info also accepts queries like a branch name (`@v/main.info`), whose
  # answer changes, and those fall through to the uncached location below.
  # nginx writes each response to a temporary file and renames it into place,
  # so it never serves a partly written file, and the cache manager evicts the
  # least recently used entries to stay under max_size.
  location ~ /@v/v[0-9]+\.[0-9]+\.[0-9]+[^/]*\.(info|mod|zip)$ {
    proxy_pass https://proxy.golang.org;
    proxy_cache goproxy;
    proxy_cache_valid 200 30d;
    proxy_ignore_headers Cache-Control Expires;
    proxy_cache_lock on;
    add_header X-Cache-Status $upstream_cache_status;
    # proxy.golang.org redirects large zips to signed storage.googleapis.com
    # URLs. Follow those here, so the zip is cached too instead of Go
    # downloading it directly.
    proxy_intercept_errors on;
    error_page 302 = @redirect;
  }

  location @redirect {
    set $target $upstream_http_location;
    proxy_pass $target;
    proxy_cache goproxy;
    proxy_cache_valid 200 30d;
    proxy_ignore_headers Cache-Control Expires;
    proxy_cache_lock on;
    add_header X-Cache-Status $upstream_cache_status;
  }

  # Version lists, @latest, queries, and anything else can change: pass
  # through.
  location / {
    proxy_pass https://proxy.golang.org;
  }
}
